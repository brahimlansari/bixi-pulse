[project]
name = "bixi-pulse"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Lansari ibrahim", email = "brahimlansari2002@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "azure-identity>=1.27.0",
    "azure-storage-file-datalake>=12.26.1",
    "duckdb>=2.0.0",
    "pyarrow>=26.0.1",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
]

[project.scripts]
bixi-pulse = "bixi_pulse:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
builtins = ["spark", "dbutils", "display"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
